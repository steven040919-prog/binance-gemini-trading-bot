name: Binance + Gemini AI Autonomous Trading Bot (24/7)

on:
  schedule:
    # Ejecuta un ciclo autonomo cada 15 minutos, 24/7
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Modo simulacion sin ordenes reales (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Evita que dos ciclos se solapen al mismo tiempo
concurrency:
  group: binance-gemini-trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar ciclo del Bot Autonomo
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BINANCE_PROXY_URL: ${{ secrets.BINANCE_PROXY_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN || 'false' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS || '3' }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT || '0.25' }}
          STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT || '0.035' }}
          TAKE_PROFIT_PCT: ${{ vars.TAKE_PROFIT_PCT || '0.070' }}
          TRAILING_STOP_PCT: ${{ vars.TRAILING_STOP_PCT || '0.025' }}
          MAX_DAILY_DRAWDOWN_PCT: ${{ vars.MAX_DAILY_DRAWDOWN_PCT || '0.060' }}
        run: |
          python main.py

      - name: Guardar estado, historial y reporte en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bot_state.json data/trade_history.json data/latest_report.md
          if git diff --staged --quiet; then
            echo "No hubo cambios en el estado."
          else
            git commit -m "chore(bot): actualizar estado y reporte del ciclo [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
